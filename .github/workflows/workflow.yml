name: Flask App CI/CD
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target: flask-app-1, flask-app-2, or all'
        required: false
        default: 'all'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Echo Poorna
      run: echo "Poorna!!"

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.8
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

  build-push-docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: false

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./FlaskWebProject1
          file: ./FlaskWebProject1/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/flask-app:${{ github.sha }}

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            cd /home/azureuser/app
            IMAGE_TAG=${{ github.sha }}
            DOCKER_IMAGE="${{ secrets.DOCKER_USERNAME }}/flask-app:${IMAGE_TAG}"

            # Determine the deployment target. workflow_dispatch input 'target' takes precedence.
            if [ -n "${{ github.event.inputs.target }}" ]; then
              TARGET="${{ github.event.inputs.target }}"
            else
              TARGET="all"
            fi

            echo "Deploying image: ${DOCKER_IMAGE} to target: ${TARGET}"

            # Choose docker-compose command
            if command -v docker-compose >/dev/null 2>&1; then
              DC="docker-compose"
            else
              DC="docker compose"
            fi

            # Update only the image lines for the selected service(s). Use perl for multiline replace.
            if [ "${TARGET}" = "flask-app-1" ] || [ "${TARGET}" = "all" ]; then
              echo "Updating image for flask-app-1"
              perl -0777 -pe "s/(flask-app-1:\n(?:.*?\n)*?\simage:\s)\S+/\$1${DOCKER_IMAGE}/" -i docker-compose.yml || true
            fi

            if [ "${TARGET}" = "flask-app-2" ] || [ "${TARGET}" = "all" ]; then
              echo "Updating image for flask-app-2"
              perl -0777 -pe "s/(flask-app-2:\n(?:.*?\n)*?\simage:\s)\S+/\$1${DOCKER_IMAGE}/" -i docker-compose.yml || true
            fi

            echo "--- docker-compose.yml (after update) ---"
            cat docker-compose.yml || true

            # Pull and start only the targeted service(s) to avoid touching the other
            if [ "${TARGET}" = "flask-app-1" ]; then
              echo "Pulling and updating flask-app-1 only"
              $DC pull flask-app-1 || true
              $DC up -d flask-app-1
            elif [ "${TARGET}" = "flask-app-2" ]; then
              echo "Pulling and updating flask-app-2 only"
              $DC pull flask-app-2 || true
              $DC up -d flask-app-2
            else
              echo "Pulling and updating all services"
              $DC pull || true
              $DC down || true
              $DC up -d
            fi

            sleep 3
            $DC ps