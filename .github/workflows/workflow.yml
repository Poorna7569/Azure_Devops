name: Flask App CI/CD
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target: flask-app-1, flask-app-2, or all'
        required: false
        default: 'all'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Echo Poorna
      run: echo "Poorna!!"

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.8
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

  build-push-docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: false

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./FlaskWebProject1
          file: ./FlaskWebProject1/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/flask-app:${{ github.sha }}

      - name: Copy docker-compose.yml to VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          source: docker-compose.yml
          target: /home/azureuser/app/

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            cd /home/azureuser/app

            # If this directory is a git checkout, try to sync it to origin/main so the
            # VM has the latest docker-compose.yml from the repository. This avoids
            # situations where an outdated compose file on the VM causes mismatched
            # service names. The git commands are guarded and won't fail the job.
            if [ -d .git ]; then
              echo "Found .git — attempting to update working tree to origin/main"
              git fetch --all --prune || true
              git reset --hard origin/main || true
            else
              echo "No .git directory — leaving existing files in place"
            fi

            IMAGE_TAG=${{ github.sha }}
            DOCKER_IMAGE="${{ secrets.DOCKER_USERNAME }}/flask-app:${IMAGE_TAG}"

            # Determine the deployment target. workflow_dispatch input 'target' takes precedence.
            if [ -n "${{ github.event.inputs.target }}" ]; then
              TARGET="${{ github.event.inputs.target }}"
            else
              TARGET="all"
            fi

            echo "Deploying image: ${DOCKER_IMAGE} to target: ${TARGET}"

            # Choose docker-compose command
            if command -v docker-compose >/dev/null 2>&1; then
              DC="docker-compose"
            else
              DC="docker compose"
            fi

            # Detect service names present in docker-compose.yml on the VM and map requested
            # targets (flask-app-1 / flask-app-2) to the actual service names found there.
            SERVICE1_NAME=""
            SERVICE2_NAME=""

            if grep -qE '^\s*flask-app-1:' docker-compose.yml; then
              SERVICE1_NAME="flask-app-1"
            elif grep -qE '^\s*flask-app:' docker-compose.yml; then
              SERVICE1_NAME="flask-app"
            elif grep -qE '^\s*flask:' docker-compose.yml; then
              SERVICE1_NAME="flask"
            fi

            if grep -qE '^\s*flask-app-2:' docker-compose.yml; then
              SERVICE2_NAME="flask-app-2"
            elif grep -qE '^\s*flask-app:' docker-compose.yml; then
              SERVICE2_NAME="flask-app"
            elif grep -qE '^\s*flask:' docker-compose.yml; then
              SERVICE2_NAME="flask"
            fi

            echo "Detected service names: SERVICE1=${SERVICE1_NAME:-<none>} SERVICE2=${SERVICE2_NAME:-<none>}"

            # Map TARGET to the actual service name to operate on
            if [ "${TARGET}" = "flask-app-1" ]; then
              SERVICE_TO_UPDATE="${SERVICE1_NAME}"
            elif [ "${TARGET}" = "flask-app-2" ]; then
              SERVICE_TO_UPDATE="${SERVICE2_NAME}"
            else
              SERVICE_TO_UPDATE="all"
            fi

            # If a single-target was requested but we couldn't detect a matching service, fail
            if [ "${SERVICE_TO_UPDATE}" != "all" ] && [ -z "${SERVICE_TO_UPDATE}" ]; then
              echo "Requested target '${TARGET}' not found in docker-compose.yml on VM. Aborting."
              echo "--- docker-compose.yml (current) ---"
              cat docker-compose.yml || true
              exit 1
            fi

            # Update image line(s) for the determined service name(s).
            # The regex matches placeholders like APP1_PLACEHOLDER or full image names.
            if [ "${SERVICE_TO_UPDATE}" = "all" ]; then
              # Update any recognized service names if present
              if [ -n "${SERVICE1_NAME}" ]; then
                echo "Updating image for ${SERVICE1_NAME}"
                perl -0777 -pe "s|(${SERVICE1_NAME}:\n(?:.*?\n)*?\simage:\s)\S+|$1${DOCKER_IMAGE}|g" -i docker-compose.yml || true
              fi
              if [ -n "${SERVICE2_NAME}" ]; then
                echo "Updating image for ${SERVICE2_NAME}"
                perl -0777 -pe "s|(${SERVICE2_NAME}:\n(?:.*?\n)*?\simage:\s)\S+|$1${DOCKER_IMAGE}|g" -i docker-compose.yml || true
              fi
            else
              echo "Updating image for ${SERVICE_TO_UPDATE}"
              perl -0777 -pe "s|(${SERVICE_TO_UPDATE}:\n(?:.*?\n)*?\simage:\s)\S+|$1${DOCKER_IMAGE}|g" -i docker-compose.yml || true
            fi

            echo "--- docker-compose.yml (after update) ---"
            cat docker-compose.yml || true

            # Ensure Docker daemon is running on the VM before running compose operations.
            if ! sudo systemctl is-active --quiet docker; then
              echo "Docker service is not active — attempting to start"
              sudo systemctl start docker || true
              sleep 3
            fi

            # Pull and start only the targeted service(s) to avoid touching the other
            if [ "${TARGET}" = "flask-app-1" ]; then
              echo "Pulling and updating flask-app-1 only"
              $DC pull flask-app-1 || true
              $DC up -d flask-app-1
            elif [ "${TARGET}" = "flask-app-2" ]; then
              echo "Pulling and updating flask-app-2 only"
              $DC pull flask-app-2 || true
              $DC up -d flask-app-2
            else
              echo "Pulling and updating all services"
              $DC pull || true
              $DC down || true
              $DC up -d
            fi

            sleep 3
            $DC ps